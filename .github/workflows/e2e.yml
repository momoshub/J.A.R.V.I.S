# Real Slack, in a private test channel named by the JARVIS_E2E_CHANNEL repository variable (see
# README "Testing"). The bot token is a secret of the `e2e` environment, never a repository secret:
# the environment only deploys from main, so a workflow edited on any other branch or PR (by anyone
# with write access, or an app that can push) is refused the token. That is also why this runs on a
# push to main only, after a reviewed merge, and never on a PR. It is a separate workflow, not a job
# in ci.yml, so a PR run has no e2e job at all: a cancelled one would otherwise leave a red row that
# bin/merge-when-green.sh reads as failed CI.
# Opt-in per repo: only where the JARVIS_E2E_CHANNEL variable is set, so a fork or a copy without a
# Slack workspace stays green. Where it is set, a missing secret fails here: the suite would
# otherwise skip itself and pass.
name: e2e

on:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: vars.JARVIS_E2E_CHANNEL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3 # same as the host and ci.yml; bump together
      - run: bun install --frozen-lockfile
      - name: e2e (real Slack)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.JARVIS_E2E_SLACK_BOT_TOKEN }}
          JARVIS_E2E_CHANNEL: ${{ vars.JARVIS_E2E_CHANNEL }}
        run: |
          test -n "$SLACK_BOT_TOKEN" || { echo "JARVIS_E2E_SLACK_BOT_TOKEN secret is not set on the e2e environment" >&2; exit 1; }
          test -n "$JARVIS_E2E_CHANNEL" || { echo "JARVIS_E2E_CHANNEL repository variable is not set" >&2; exit 1; }
          bun run test:e2e
