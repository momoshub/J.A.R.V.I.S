# Typecheck, tests, a secret scan and (where secrets exist) the real-Slack e2e suite on every PR and
# every push to main. The merge gate for self-fixes is bin/merge-when-green.sh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3 # same as the host; bump together
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Real Slack, in the private #jarvis_self_testing (see README "Testing").
      # A missing secret fails here: the suite would otherwise skip itself and pass.
      - name: e2e (real Slack)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.JARVIS_E2E_SLACK_BOT_TOKEN }}
        run: |
          test -n "$SLACK_BOT_TOKEN" || { echo "JARVIS_E2E_SLACK_BOT_TOKEN secret is not set" >&2; exit 1; }
          bun run test:e2e
      # The dashboard has its own deps and tsconfig, and only a build proves it bundles.
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx tsc --noEmit
        working-directory: web
      - run: bun run build
        working-directory: web

  # Secret scan with the gitleaks CLI (the action needs a licence for organisations).
  # Push: the whole history. Pull request: only the commits it adds. False positives
  # (test vectors, fake tokens) are fingerprinted in .gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan history (push)
        if: github.event_name == 'push'
        run: gitleaks git . --redact --no-banner
      - name: scan the PR range
        if: github.event_name == 'pull_request'
        run: gitleaks git . --redact --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
