# Typecheck, tests, a secret scan and (where secrets exist) the real-Slack e2e suite on every PR and
# every push to main. The secret scan also runs on a push of any branch or tag, so a push that
# skipped the local hook is still caught. The merge gate for self-fixes is bin/merge-when-green.sh.
name: ci

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3 # same as the host; bump together
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Real Slack, in a private test channel named by the JARVIS_E2E_CHANNEL repository variable (see README "Testing"). Secrets are never
      # passed to fork PRs, so those skip this step. Where the variable is set, a missing
      # secret fails here: the suite would otherwise skip itself and pass.
      - name: e2e (real Slack)
        # opt-in per repo: only where the JARVIS_E2E_CHANNEL variable is set, so a fork or
        # a copy without a Slack workspace stays green instead of failing on a missing secret
        if: vars.JARVIS_E2E_CHANNEL != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.JARVIS_E2E_SLACK_BOT_TOKEN }}
          JARVIS_E2E_CHANNEL: ${{ vars.JARVIS_E2E_CHANNEL }}
        run: |
          test -n "$SLACK_BOT_TOKEN" || { echo "JARVIS_E2E_SLACK_BOT_TOKEN secret is not set" >&2; exit 1; }
          test -n "$JARVIS_E2E_CHANNEL" || { echo "JARVIS_E2E_CHANNEL repository variable is not set" >&2; exit 1; }
          bun run test:e2e
      # The dashboard has its own deps and tsconfig, and only a build proves it bundles.
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx tsc --noEmit
        working-directory: web
      - run: bun run build
        working-directory: web

  # Secret scan with the gitleaks CLI (the action needs a licence for organisations).
  # Push (any branch or tag): the whole history from the pushed ref, plus every tag. Pull request: only the commits it adds. Both scan the diffs and,
  # separately, the commit messages, file paths and annotated tag messages, which gitleaks git
  # never reads. False positives (test vectors, fake tokens) are allowlisted by value in
  # .gitleaks.toml. Rules: .gitleaks.toml plus the private names rule from the LEAK_NAMES_TOML
  # secret, both through bin/leak-scan.sh. The secret is required wherever GitHub passes it
  # (pushes, same-repo PRs), so a deleted or renamed secret fails instead of skipping names;
  # only fork PRs skip it.
  # The log is public: never -v, and LEAK_SCAN_QUIET keeps gitleaks' own output (a panic on a
  # broken names regex prints every name) out of it. Locations only.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      LEAK_NAMES_TOML: ${{ secrets.LEAK_NAMES_TOML }}
      LEAK_NAMES_REQUIRED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      LEAK_SCAN_QUIET: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: pick the range
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "LEAK_SCAN_RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            git fetch -q --tags origin
            echo "LEAK_SCAN_RANGE=HEAD" >> "$GITHUB_ENV"
            echo "LEAK_SCAN_TAGS=$(git for-each-ref refs/tags --format='%(objectname)' | tr '\n' ' ')" >> "$GITHUB_ENV"
          fi
      - name: scan the diffs
        run: |
          set +e
          bin/leak-scan.sh git . --redact --no-banner --report-format json --report-path leaks.json --log-opts="$LEAK_SCAN_RANGE"
          code=$?
          set -e
          jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) \(.Commit[0:8])"' leaks.json 2>/dev/null || true
          exit "$code"
      - name: scan commit messages, file paths and tag messages
        run: |
          set +e
          bin/leak-scan.sh meta --redact --no-banner --report-format json --report-path leaks-meta.json
          code=$?
          set -e
          jq -r '.[] | "\(.RuleID) in a commit message, file path or tag message"' leaks-meta.json 2>/dev/null || true
          exit "$code"
