# Leak guard for this public repo. Extends the gitleaks default rules with one
# project rule (Slack ids). A second rule (real people and brand names) is NOT
# committed, as listing the names here would publish them: it is loaded from an
# uncommitted file by bin/leak-scan.sh (see docs/leak-names.example.toml and the README).
title = "jarvis leak guard"

[extend]
useDefault = true

[allowlist]
description = "known fake secrets in tests"
# no path is exempt here. gitleaks' default allowlist (useDefault) skips whole file
# types, this file included, so bin/leak-scan.sh also runs these rules without it
# the known fake secrets in tests, by value, so a history rewrite (new SHAs) does
# not break the scan the way .gitleaksignore fingerprints do: the RFC 6238 seed,
# a made-up DASHBOARD_TOKEN and a made-up xoxb fed to the redactor
regexTarget = "match"
regexes = ['''GEZDGNBVGY3TQOJQ''', '''0123456789abcdef0123456789abcdef''', '''xoxb-123456789012-abcdefghijkl''']

# (a) Slack ids that look real: user/channel/DM/group/workspace/team/bot/app/
# enterprise/user group/file ids (U C D G W T B A E S F), a digit, then 7-10 more upper-case chars.
# That also covers legacy ids without the leading 0. Bounded by any non-alphanumeric
# (not \b, which treats _ as a word character and missed owner_U... and C..._history)
# or a string escape (\n, \t, \u00a0 in JSON fixtures and captured payloads);
# the id itself is the secret group, so the allowlist below sees the id alone.
[[rules]]
id = "slack-real-looking-id"
description = "Slack id (user, channel, DM, team, bot, app, enterprise, user group, file) that is not a test fake"
regex = '''(?m)(?:^|[^A-Za-z0-9]|\\[nrtbfv]|\\u[0-9A-Fa-f]{4})([UCDGWTBAESF][0-9][A-Z0-9]{7,10})(?:_|\b)'''
secretGroup = 1
# no keywords: the prefilter would have to list every letter+digit pair, and a gap
# silently skips files (U3.../C5... ids)

  [[rules.allowlists]]
  description = "the fake ids the tests use: a role word plus a counter (U0OWNER0001, U0PAL0007, C0TEST0000N, U0NUISANCE), U0123456789, and the user id Slack's own API docs use as their example. Explicit words, so a random real id does not slip through"
  regexTarget = "secret"
  regexes = ['''^[UCDGW]0(?:OWNER|PAL|ALEX|TEST|BOT|DEV|USER|REVIEW|EXE|GONE|SNUBBED|ADMIN|TEAM|NUISANCE|OTHER|DM|STRANGE)[0-9N]*$''', '''^U0123456789$''', '''^U024BE7LH$''']

  [[rules.allowlists]]
  description = "this config's own pattern lines (regex, regexes, keywords), which have to spell out what they hunt. Whole lines only: a trailing comment, a description or any other line here is still scanned (by the no-defaults pass, since gitleaks' defaults skip this file)"
  condition = "AND"
  paths = ['''^\.gitleaks\.toml$''']
  regexTarget = "line"
  regexes = ['''(?m)^\s*(?:regex|regexes|keywords)\s*=\s*\[?\s*(?:'{3}.*?'{3}|"[^"\n]*")(?:\s*,\s*(?:'{3}.*?'{3}|"[^"\n]*"))*\s*\]?\s*$''']
