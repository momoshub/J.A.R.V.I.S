# Leak guard for this public repo. Extends the gitleaks default rules with two
# project rules. A third rule (real people and brand names) is NOT committed, as
# listing the names here would publish them: it is loaded from an uncommitted file
# by bin/leak-scan.sh (see docs/leak-names.example.toml and the README).
title = "jarvis leak guard"

[extend]
useDefault = true

[allowlist]
description = "known fake secrets in tests"
# no path is exempt here. gitleaks' default allowlist (useDefault) skips whole file
# types, this file included, so bin/leak-scan.sh also runs these rules without it
# the known fake secrets in tests, by value, so a history rewrite (new SHAs) does
# not break the scan the way .gitleaksignore fingerprints do: the RFC 6238 seed,
# a made-up DASHBOARD_TOKEN, a made-up xoxb fed to the redactor and the user id
# Slack's own API docs use as their example
regexTarget = "match"
regexes = ['''GEZDGNBVGY3TQOJQ''', '''0123456789abcdef0123456789abcdef''', '''xoxb-123456789012-abcdefghijkl''', '''^U024BE7LH$''']

# (a) Slack ids that look real: user/channel/DM/group/workspace/team/bot/app/
# enterprise ids (U C D G W T B A E), a digit, then 7-10 more upper-case chars.
# That also covers legacy ids without the leading 0 (U024BE7LH).
[[rules]]
id = "slack-real-looking-id"
description = "Slack id (user, channel, DM, team, bot, app, enterprise) that is not a test fake"
regex = '''\b[UCDGWTBAE][0-9][A-Z0-9]{7,10}\b'''
# no keywords: the prefilter would have to list every letter+digit pair, and a gap
# silently skips files (U3.../C5... ids)

  [rules.allowlist]
  description = "the fake ids the tests use: a role word plus a counter (U0OWNER0001, U0PAL0007, C0TEST0000N, U0NUISANCE) and U0123456789. Explicit words, so a random real id does not slip through"
  regexTarget = "match"
  regexes = ['''^[UCDGW]0(?:OWNER|PAL|ALEX|TEST|BOT|DEV|USER|REVIEW|EXE|GONE|SNUBBED|ADMIN|TEAM|NUISANCE|OTHER|DM|STRANGE)[0-9N]*$''', '''^U0123456789$''']

# (b) the employer name: only the copyright lines may carry it.
[[rules]]
id = "employer-name"
description = "employer name outside the copyright lines"
regex = '''(?i)momos'''
keywords = ["momos"]

  [[rules.allowlists]]
  description = "the copyright line in LICENSE, NOTICE and the README license line"
  condition = "AND"
  paths = ['''^(LICENSE|NOTICE|README\.md)$''']
  regexTarget = "line"
  regexes = ['''Copyright 2026 Momos\b''']

  [[rules.allowlists]]
  description = "commit messages: GitHub's own merge line names the org the repo lives in (the repo URL already shows it), and the commit that set the copyright holder says so. Whole lines only, so extra text on the line is still flagged"
  regexTarget = "line"
  regexes = ['''(?m)^Merge pull request #[0-9]+ from momoshub/[A-Za-z0-9._/-]+$''', '''(?m)^(?:Copyright holder: Momos|docs: copyright holder is Momos)$''']

  [[rules.allowlists]]
  description = "this config's own pattern lines (regex, regexes, keywords), which have to spell out what they hunt. Whole lines only: a trailing comment, a description or any other line here is still scanned (by the no-defaults pass, since gitleaks' defaults skip this file)"
  condition = "AND"
  paths = ['''^\.gitleaks\.toml$''']
  regexTarget = "line"
  regexes = ['''(?m)^\s*(?:regex|regexes|keywords)\s*=\s*\[?\s*(?:'{3}[^'\n]*'{3}|"[^"\n]*")(?:\s*,\s*(?:'{3}[^'\n]*'{3}|"[^"\n]*"))*\s*\]?\s*$''']
