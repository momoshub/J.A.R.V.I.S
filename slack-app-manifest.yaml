# Slack app manifest. Create the app from it: https://api.slack.com/apps -> Create New App
# -> From a manifest -> paste this file. Then (README "Quickstart"):
#   1. Basic Information -> App-Level Tokens -> generate one with `connections:write`
#      (SLACK_APP_TOKEN), 2. Install to Workspace and copy the Bot User OAuth Token
#      (SLACK_BOT_TOKEN).
# Slash command names must match SLASH_COMMAND (default /bot); /rv, /br and /jrp are the
# optional power-tool commands. Socket Mode needs no request URL (the url is a placeholder).
display_information:
  name: Assistant
  description: A Slack agent bot powered by the Claude CLI
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Assistant
    always_online: true
  slash_commands:
    - command: /bot
      url: https://example.invalid/slack/commands
      description: Run a bot command
      usage_hint: "help"
      should_escape: false
    - command: /rv
      url: https://example.invalid/slack/commands
      description: Review a pull request
      should_escape: false
    - command: /br
      url: https://example.invalid/slack/commands
      description: Reaction-bomb a message
      should_escape: false
    - command: /jrp
      url: https://example.invalid/slack/commands
      description: Draft and post an AI reply to a message
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - files:read
      - files:write
      - im:history
      - im:read
      - im:write
      - reactions:read
      - reactions:write
      - users:read
      # The history scopes are needed by the message.channels/groups/mpim events; the
      # *:read ones only by the dashboard Console tab (without them it shows
      # `missing_scope` and the rest works).
      - channels:history
      - groups:history
      - mpim:history
      - channels:read
      - groups:read
      - mpim:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      # Channel messages: thread following (`follow`, own threads) and typed answers in threads.
      - message.channels
      - message.groups
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
